spring:
  application:
    name: Document-Management-System

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dmsdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

dms:
  rmq:
    exchange: dms.exchange
    queue:
      upload: dms.document.uploaded
    routing:
      upload: dms.document.uploaded

s3:
  endpoint: ${S3_ENDPOINT:http://minio:9000}
  accessKey: ${S3_ACCESS_KEY:minio}
  secretKey: ${S3_SECRET_KEY:minio123}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_BUCKET:documents}
  pathStyleAccess: true